<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CheckMe — анализатор состава продуктов</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #1a1d21;
    --text-muted: #6b7280; --border: #e5e7eb;
    --accent: #059669; --accent-soft: #d1fae5;
    --warning: #d97706; --warning-soft: #fef3c7;
    --danger: #dc2626; --danger-soft: #fee2e2;
    --radius: 14px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 12px rgba(0,0,0,0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  .header { text-align: center; margin-bottom: 28px; }
  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; background: var(--accent-soft);
    border-radius: 16px; margin-bottom: 14px;
  }
  .logo svg { width: 28px; height: 28px; stroke: var(--accent); }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
  .header p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }
  .card {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
  }
  .upload {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 32px 20px; text-align: center; cursor: pointer;
    transition: all 0.2s; background: var(--surface);
  }
  .upload:hover, .upload.drag { border-color: var(--accent); background: var(--accent-soft); }
  .upload-icon {
    width: 48px; height: 48px; margin: 0 auto 12px;
    background: var(--accent-soft); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .upload-icon svg { width: 24px; height: 24px; stroke: var(--accent); }
  .upload-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
  .upload-hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 12px 20px; border-radius: var(--radius-sm);
    border: none; font-size: 0.95rem; font-weight: 500;
    cursor: pointer; transition: all 0.15s; min-height: 44px; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #047857; }
  .btn-secondary { background: var(--bg); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn svg { width: 18px; height: 18px; }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .preview-wrap { display: none; margin-top: 16px; position: relative; }
  .preview-wrap.active { display: block; }
  .preview {
    width: 100%; max-height: 280px; object-fit: contain;
    border-radius: var(--radius-sm); background: var(--bg); display: block;
  }
  .preview-close {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: #fff; border: none;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 18px; line-height: 1;
  }
  .loading { display: none; text-align: center; padding: 24px 0; }
  .loading.active { display: block; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text-muted); font-size: 0.9rem; }
  .result { display: none; }
  .result.active { display: block; }
  .rating {
    padding: 20px; border-radius: var(--radius);
    text-align: center; margin-bottom: 16px;
  }
  .rating-icon {
    width: 48px; height: 48px; margin: 0 auto 10px;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; background: rgba(255,255,255,0.3);
  }
  .rating-icon svg { width: 24px; height: 24px; stroke: #fff; }
  .rating-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
  .rating-sub { font-size: 0.85rem; opacity: 0.9; }
  .rating.safe { background: var(--accent); color: #fff; }
  .rating.warning { background: var(--warning); color: #fff; }
  .rating.danger { background: var(--danger); color: #fff; }
  .ai-box {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 16px; margin-bottom: 16px; font-size: 0.95rem; line-height: 1.6;
  }
  .ai-box-label {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 8px; font-weight: 600;
  }
  .section-title {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 20px 0 10px; font-weight: 600;
  }
  .additive {
    background: var(--surface); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 8px;
    border-left: 3px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .additive.danger { border-left-color: var(--danger); background: var(--danger-soft); }
  .additive.warning { border-left-color: var(--warning); background: var(--warning-soft); }
  .additive.safe { border-left-color: var(--accent); background: var(--accent-soft); }
  .additive-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .additive-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
  details.raw-text {
    margin-top: 16px; background: var(--surface);
    border-radius: var(--radius-sm); padding: 12px 16px; font-size: 0.85rem;
  }
  details.raw-text summary { cursor: pointer; color: var(--text-muted); font-weight: 500; outline: none; }
  details.raw-text pre {
    margin: 12px 0 0; white-space: pre-wrap; word-break: break-word;
    color: var(--text); font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.8rem;
  }
  .footer { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 24px; }
  .error {
    background: var(--danger-soft); color: var(--danger);
    padding: 12px 16px; border-radius: var(--radius-sm);
    margin-top: 16px; font-size: 0.9rem; display: none;
  }
  .error.active { display: block; }
  @media (max-width: 480px) {
    .app { padding: 20px 16px 32px; }
    .header h1 { font-size: 1.4rem; }
    .card { padding: 16px; }
    .upload { padding: 24px 16px; }
    .btn { width: 100%; }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L4 7v10l8 5 8-5V7l-8-5z"/><path d="M12 22V12"/><path d="M4 7l8 5 8-5"/>
      </svg>
    </div>
    <h1>CheckMe</h1>
    <p>Сфотографируй состав — узнай, что в продукте</p>
  </header>
  <div class="card">
    <div class="upload" id="upload">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="upload-title">Загрузи фото этикетки</div>
      <div class="upload-hint">JPG или PNG, до 10 МБ</div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnFile">📁 Выбрать фото</button>
        <button class="btn btn-secondary" id="btnCamera">📷 Камера</button>
      </div>
    </div>
    <div class="preview-wrap" id="previewWrap">
      <img id="preview" class="preview" alt="preview">
      <button class="preview-close" id="previewClose">×</button>
    </div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Анализируем состав...</div>
    </div>
    <div class="error" id="error"></div>
    <div class="result" id="result"></div>
  </div>
  <div class="footer">Это прототип. При аллергиях консультируйтесь с врачом.</div>
</div>
<script>
const upload = document.getElementById('upload');
const fileInput = document.getElementById('fileInput');
const btnFile = document.getElementById('btnFile');
const btnCamera = document.getElementById('btnCamera');
const previewWrap = document.getElementById('previewWrap');
const preview = document.getElementById('preview');
const previewClose = document.getElementById('previewClose');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const errorBox = document.getElementById('error');
const result = document.getElementById('result');

upload.addEventListener('click', (e) => {
  if (e.target.closest('button')) return;
  fileInput.click();
});
btnFile.addEventListener('click', (e) => {
  e.stopPropagation();
  fileInput.removeAttribute('capture');
  fileInput.click();
});
btnCamera.addEventListener('click', (e) => {
  e.stopPropagation();
  fileInput.setAttribute('capture', 'environment');
  fileInput.click();
});
upload.addEventListener('dragover', (e) => { e.preventDefault(); upload.classList.add('drag'); });
upload.addEventListener('dragleave', () => upload.classList.remove('drag'));
upload.addEventListener('drop', (e) => {
  e.preventDefault();
  upload.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
previewClose.addEventListener('click', () => {
  previewWrap.classList.remove('active');
  result.classList.remove('active');
  fileInput.value = '';
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) { showError('Выбери изображение'); return; }
  if (file.size > 10 * 1024 * 1024) { showError('Файл слишком большой (макс. 10 МБ)'); return; }

  const reader = new FileReader();
  reader.onload = (e) => {
    preview.src = e.target.result;
    previewWrap.classList.add('active');
    hideError();
    compressImage(e.target.result).then(compressedBase64 => {
      analyze(compressedBase64);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(base64, maxSize = 1200, quality = 0.8) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if (width > height && width > maxSize) {
        height = (height * maxSize) / width;
        width = maxSize;
      } else if (height > maxSize) {
        width = (width * maxSize) / height;
        height = maxSize;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', quality);
      resolve(compressed);
    };
    img.src = base64;
  });
}

async function analyze(imageBase64) {
  result.classList.remove('active');
  loading.classList.add('active');
  loadingText.textContent = 'Анализируем состав...';
  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: imageBase64 })
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || 'Ошибка сервера');
    }
    const data = await response.json();
    loading.classList.remove('active');
    showResult(data);
  } catch (err) {
    loading.classList.remove('active');
    showError(err.message || 'Не удалось проанализировать. Попробуйте позже.');
  }
}

function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('active'); }
function hideError() { errorBox.classList.remove('active'); }

function showResult(data) {
  result.classList.add('active');
  const rating = data.safety_rating || 'warning';
  const ratingMap = {
    safe:    { title: 'Продукт безопасен', sub: 'Опасных компонентов не найдено' },
    warning: { title: 'Есть подозрительные компоненты', sub: 'Употребляй с осторожностью' },
    danger:  { title: 'Много опасных компонентов', sub: 'Лучше отказаться от продукта' }
  };
  const r = ratingMap[rating] || ratingMap.warning;
  const iconSvg = {
    safe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    danger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  };
  let html = `
    <div class="rating ${rating}">
      <div class="rating-icon">${iconSvg[rating]}</div>
      <div class="rating-title">${r.title}</div>
      <div class="rating-sub">${r.sub}</div>
    </div>`;
  if (data.ai_analysis) {
    html += `<div class="ai-box"><div class="ai-box-label">Анализ</div><div>${escapeHtml(data.ai_analysis).replace(/\n/g, '<br>')}</div></div>`;
  }
  if (data.additives && data.additives.length > 0) {
    html += `<div class="section-title">Компоненты (${data.additives.length})</div>`;
    for (const item of data.additives) {
      const level = ['safe','warning','danger'].includes(item.danger_level) ? item.danger_level : 'warning';
      html += `<div class="additive ${level}"><div class="additive-name">${escapeHtml(item.name)}</div><div class="additive-desc">${escapeHtml(item.description)}</div></div>`;
    }
  }
  if (data.extracted_text) {
    html += `<details class="raw-text"><summary>Распознанный текст</summary><pre>${escapeHtml(data.extracted_text)}</pre></details>`;
  }
  result.innerHTML = html;
  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
